name: Release

# hacs.json : zip_release. Chaque release publiée doit porter partition_map.zip,
# qui contient le contenu de custom_components/partition_map/ (sans le dossier).
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier que le tag correspond à la version
        run: |
          test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
          grep -q "\"version\": \"$(cat VERSION)\"" custom_components/partition_map/manifest.json
      - name: Construire partition_map.zip
        run: |
          cd custom_components/partition_map
          zip -r "${GITHUB_WORKSPACE}/partition_map.zip" . -x "__pycache__/*"
      - name: Joindre le zip à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" partition_map.zip --clobber
